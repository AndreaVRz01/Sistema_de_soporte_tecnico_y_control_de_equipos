# =============================================================================
# PostgreSQL — Configuración personalizada SIGA Enterprise
# docker/bd/postgresql.conf
# Ajustes de rendimiento para entorno universitario de desarrollo/producción
# =============================================================================

# ----- Conexiones -----
max_connections = 100

# ----- Memoria -----
shared_buffers = 128MB
effective_cache_size = 256MB
work_mem = 4MB
maintenance_work_mem = 64MB

# ----- WAL / Checkpoint -----
wal_buffers = 16MB
checkpoint_completion_target = 0.9
wal_level = replica

# ----- Planner -----
random_page_cost = 1.1
effective_io_concurrency = 200

# ----- Logging (a stdout para Docker) -----
log_destination = 'stderr'
logging_collector = off
log_min_duration_statement = 500
log_line_prefix = '%t [%p] %u@%d '
log_timezone = 'America/Mexico_City'

# ----- Zona horaria -----
timezone = 'America/Mexico_City'

# ----- Locale -----
lc_messages = 'en_US.utf8'
lc_monetary = 'es_MX.utf8'
lc_numeric = 'es_MX.utf8'
lc_time = 'es_MX.utf8'
