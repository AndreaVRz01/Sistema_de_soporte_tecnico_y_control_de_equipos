# =============================================================================
# Nginx Virtual Host — Contenedor APP (puerto 8080 sin root)
# Sirve Laravel 12 a través de PHP-FPM TCP 127.0.0.1:9000
# =============================================================================

server {
    listen 8080;
    server_name _;

    root /var/www/siga/public;
    index index.php index.html;

    # Charset
    charset utf-8;

    # Límite de cuerpo de solicitud
    client_max_body_size 25M;

    # Cabeceras de seguridad
    add_header X-Frame-Options           "SAMEORIGIN"   always;
    add_header X-Content-Type-Options    "nosniff"      always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # Health check interno (usado por Docker healthcheck)
    # Debe responder 200 sin depender de Laravel para que Docker considere
    # el contenedor como healthy incluso durante arranque inicial.
    location = /up {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Archivos estáticos con caché
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot|map)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Ruta principal — Laravel front controller
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM vía TCP 127.0.0.1:9000
    location ~ \.php$ {
        fastcgi_pass  127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        fastcgi_connect_timeout 60s;
        fastcgi_send_timeout    60s;
        fastcgi_read_timeout    60s;
        fastcgi_buffer_size     16k;
        fastcgi_buffers         4 16k;
    }

    # Bloquear acceso a archivos ocultos (.env, .git, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Bloquear acceso a artisan y archivos de configuración
    location ~ /(artisan|composer\.(json|lock)|package\.json) {
        deny all;
    }
}
