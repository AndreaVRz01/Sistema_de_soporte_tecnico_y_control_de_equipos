# =============================================================================
# Nginx principal — SIGA Enterprise (contenedor app)
# Sin directiva 'user' — Nginx corre como el usuario del proceso (www uid=1000)
# Escucha en puerto 8080 (no requiere privilegios root)
# =============================================================================

worker_processes  auto;
pid /tmp/nginx.pid;

error_log  /dev/stderr warn;

events {
    worker_connections  1024;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logs a stdout/stderr para Docker
    access_log  /dev/stdout;
    error_log   /dev/stderr warn;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # Directorios temporales accesibles sin root
    client_body_temp_path /tmp/nginx_client_temp;
    proxy_temp_path       /tmp/nginx_proxy_temp;
    fastcgi_temp_path     /tmp/nginx_fastcgi_temp;
    uwsgi_temp_path       /tmp/nginx_uwsgi_temp;
    scgi_temp_path        /tmp/nginx_scgi_temp;

    include /etc/nginx/http.d/*.conf;
}
