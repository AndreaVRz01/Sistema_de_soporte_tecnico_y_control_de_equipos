; =============================================================================
; PHP Runtime — SIGA Enterprise (docker/app/php.ini)
; Optimizado para Laravel 12 + PostgreSQL en contenedor Docker sin root
; =============================================================================

[PHP]
memory_limit = 256M
max_execution_time = 60
max_input_time = 60
max_input_vars = 3000

upload_max_filesize = 20M
post_max_size = 25M

; Zona horaria institucional
date.timezone = America/Mexico_City

; Seguridad
expose_php = Off
display_errors = Off
log_errors = On
error_log = /dev/stderr

; Sesiones
session.gc_maxlifetime = 7200
session.cookie_httponly = 1
session.cookie_secure = 0
session.use_strict_mode = 1
