# =============================================================================
# SIGA Enterprise — Docker Compose
# Servicios: bd (PostgreSQL), app (Laravel+PHP-FPM+Nginx), vite (Assets Node),
#            frontend (Nginx Proxy Reverso)
# Sin root en ningún contenedor | Configuración gobernada por .env
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # 1. BD: PostgreSQL 16 Alpine
  # Base de datos institucional sin usuario root
  # ---------------------------------------------------------------------------
  bd:
    image: postgres:16-alpine
    container_name: siga_bd
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB:       ${DB_DATABASE:-siga_db}
      POSTGRES_USER:     ${DB_USERNAME:-siga_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-siga_pass_2024}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.utf8"
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: America/Mexico_City

    volumes:
      - siga_pgdata:/var/lib/postgresql/data
      - ./docker/bd/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./docker/bd/postgresql.conf:/etc/postgresql/postgresql.conf:ro

    ports:
      - "${DB_EXPOSE_PORT:-5432}:5432"

    networks:
      - siga_network

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-siga_user} -d ${DB_DATABASE:-siga_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ---------------------------------------------------------------------------
  # 2. VITE: Compilación de Assets (Node 20 Alpine)
  # Solo ejecuta build si se invoca con profile 'build'
  # ---------------------------------------------------------------------------
  vite:
    build:
      context: .
      dockerfile: docker/vite/Dockerfile
      target: vite-builder
    container_name: siga_vite
    profiles:
      - build
    command: sh -c "npm run build && echo 'Assets Vite listos.'"
    volumes:
      - ./public:/app/public
      - ./resources:/app/resources:ro
      - vite_node_modules:/app/node_modules
    networks:
      - siga_network

  # ---------------------------------------------------------------------------
  # 3. APP: Laravel 12 + PHP 8.2-FPM + Nginx interno (puerto 8080)
  # Corre con usuario no-root 'www' (uid 1000)
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: siga_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV:        ${APP_ENV:-production}
      APP_URL:        ${APP_URL:-http://localhost:8000}
      DB_CONNECTION:  ${DB_CONNECTION:-pgsql}
      DB_HOST:        bd
      DB_PORT:        5432
      DB_DATABASE:    ${DB_DATABASE:-siga_db}
      DB_USERNAME:    ${DB_USERNAME:-siga_user}
      DB_PASSWORD:    ${DB_PASSWORD:-siga_pass_2024}
      SESSION_DRIVER: file
      CACHE_STORE:    file
      LOG_CHANNEL:    stderr

    volumes:
      - siga_storage:/var/www/siga/storage
      - siga_bootstrap_cache:/var/www/siga/bootstrap/cache

    # Permite entrar directo a http://localhost:8080
    ports:
      - "${APP_PORT:-8080}:8080"

    depends_on:
      bd:
        condition: service_healthy

    networks:
      - siga_network

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/up"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 25s

  # ---------------------------------------------------------------------------
  # 4. FRONTEND: Nginx Proxy Reverso (imagen oficial unprivileged no-root)
  # Permite entrar a http://localhost:8000 o http://localhost:8088
  # ---------------------------------------------------------------------------
  frontend:
    image: nginxinc/nginx-unprivileged:alpine
    container_name: siga_frontend
    restart: unless-stopped
    volumes:
      - ./docker/nginx/frontend.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/siga/public:ro
    ports:
      - "${FRONTEND_PORT:-8000}:8088"
      - "8088:8088"
    depends_on:
      app:
        condition: service_healthy
    networks:
      - siga_network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8088/health"]
      interval: 15s
      timeout: 5s
      retries: 3

# =============================================================================
# REDES
# =============================================================================
networks:
  siga_network:
    driver: bridge
    name: siga_network

# =============================================================================
# VOLÚMENES PERSISTENTES
# =============================================================================
volumes:
  siga_pgdata:
    name: siga_pgdata
  siga_storage:
    name: siga_storage_data
  siga_bootstrap_cache:
    name: siga_bootstrap_cache
  vite_node_modules:
    name: siga_vite_node_modules
